<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Autenticação</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>

<style>
/* Estilos Gerais */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    /* Usando uma fonte serifada para combinar com a imagem */
    font-family: 'Inter', sans-serif;
}

body {
    /* Cor de fundo azul acinzentado da imagem */
    background: #3B507C;
    height: 100vh;
    display: flex;
    flex-direction: column; /* Alinha itens verticalmente */
    align-items: center;
    justify-content: center;
}

/* Container do Login */
.login-container {
    /* Cor de fundo creme/bege do container */
    background: #F5F0EA;
    padding: 40px;
    /* Borda arredondada mais sutil */
    border-radius: 8px;
    text-align: center;
    width: 100%;
    max-width: 380px;
    /* Removendo a sombra para um visual mais limpo */
    box-shadow: none;
}

.login-container h1 {
    /* Cor azul escuro para o título */
    color: #10224F;
    margin-bottom: 25px;
    font-size: 2.5rem; /* Aumentando um pouco o título */
    font-weight: 700;
}

/* Rótulos dos campos */
label {
    display: block;
    /* Cor azul escuro para os rótulos */
    color: #10224F;
    margin-bottom: 8px;
    text-align: left;
    font-size: 1rem;
    font-weight: 500;
}

/* Campos de Input */
input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 20px;
    /* Borda cinza clara e sutil */
    border: 1px solid #D1D1D1;
    border-radius: 6px;
    background-color: #FFFFFF;
    color: #333;
    font-size: 1rem;
}

/* Botão de Envio */
button[type="submit"] {
    width: 100%;
    /* Cor de fundo azul escuro para o botão */
    background-color: #10224F;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s ease;
    margin-top: 10px; /* Reduzindo a margem superior */
    font-size: 1rem;
}

button[type="submit"]:hover {
    /* Efeito hover para o botão */
    background-color: #2c447c;
}

/* Link "Esqueceu sua senha?" */
.forgot-password {
    margin-top: 20px;
    display: block;
    /* Cor azul escuro para o link */
    color: #10224F;
    text-decoration: underline;
    font-size: 0.9rem;
}
</style>

<body>
  <div class="login-container">
    <h1>Login</h1>
    <form action="/" method="POST" >
      {% csrf_token %}
      <label for="usuario">Email:</label>
      <input type="text" name="usuario" id="usuario" placeholder="Digite seu e-mail">

      <label for="senha">Senha:</label>
      <input type="password" name="senha" id="senha" placeholder="Digite sua senha">

      <button type="submit">Entrar</button>
      <a href="#" class="forgot-password">Esqueceu a senha?</a>
    </form>
  </div>
      {% if mensagem %}
        <div class="alert-danger" role="alert">
          {{ mensagem }}
        </div>
      {% endif %}
</body>
</html>
